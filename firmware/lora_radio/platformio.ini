[platformio]
default_envs = modem

[env:modem]
platform = espressif32@7.1.3
board = seeed_xiao_esp32s3
; This target's installed bootloader recovered only with a dual-I/O header.
; Keep it explicit so full-image uploads cannot rewrite offset 0 with the QIO
; header that produced a TG0WDT loop on the tested board.
board_build.flash_mode = dio
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib@7.7.1
build_flags =
  -D CORE_DEBUG_LEVEL=0

; Laboratory-only profile.  This does not authorize RF transmission.
[env:modem_lab_17dbm]
extends = env:modem
build_flags =
  ${env:modem.build_flags}
  -D MOWGLI_LORA_TX_POWER_DBM=17

; USB-only recovery image. It deliberately never initializes or transmits on RF.
[env:modem_usb_recovery]
extends = env:modem
build_flags =
  ${env:modem.build_flags}
  -D MOWGLI_LORA_USB_RECOVERY=1
